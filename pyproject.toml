[project]
name = "analyzing-persona-effects-mllm"
version = "0.1.0"
description = "Analysis of persona effects on captions & justifications from multimodal LLMs"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.2.3",
    "transformers>=4.40",
    "torch>=2.2",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "scipy>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "plotly>=5.22",
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.15",
    "pandas-stubs>=2.2",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]
extend-exclude = ["notebooks", ".venv", ".baseline"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "D", "ANN",
    "UP", "B", "A", "C4", "SIM", "RET", "ARG", "PIE", "PERF", "FURB",
    "PTH", "NPY", "PD", "PL", "C90",
    "S", "BLE", "DTZ", "ISC", "PGH", "TID", "FBT", "RSE", "ERA", "RUF",
]
ignore = [
    "EM101", "EM102", "TRY003",
    "PLR0913", "PLR2004",
    "PLC0415",
    "COM812", "ISC001",
    "TID252",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tools"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-statements = 60

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607", "D100", "D103", "D104", "ANN001", "ANN201", "PLR2004", "SLF001"]
"src/*/__init__.py" = ["F401", "D104"]
"tools/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "tools"]
strict = true
warn_return_any = false
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["^notebooks/", "^\\.baseline/"]

[[tool.mypy.overrides]]
module = [
    "seaborn.*", "sklearn.*", "bertopic.*", "umap.*", "hdbscan.*",
    "sentence_transformers.*", "scipy.*", "transformers.*", "hdbscan",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
norecursedirs = ["src", "notebooks", "data", "outputs", "figures", ".venv", ".baseline"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "integration: needs the 46 MB corpora and/or generated outputs/<model> artifacts",
    "slow: runs full 100k-resample statistics",
]
