[project]
name = "percepta-urbana"
version = "0.1.0"
description = "Annotator caption & justification perception analysis — UrbCom follow-up"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "tqdm>=4.66",
    "scikit-learn>=1.8.0",
    "nltk>=3.9.2",
    "sentence-transformers>=5.2.3",
    "transformers>=4.40",
    "torch>=2.2",
    "bertopic>=0.16",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "vaderSentiment>=3.3",
    "pyarrow>=15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "scipy>=1.17.0",
    "plotly>=5.22",
]
